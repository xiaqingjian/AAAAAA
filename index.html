let useList = [];
let currentIndex = 0;
let score = 0;
let isAnswered = false;

function hideAll(){
  document.getElementById('homeView').classList.add('hide');
  document.getElementById('quizView').classList.add('hide');
}
function goHome(){
  hideAll();
  document.getElementById('homeView').classList.remove('hide');
  currentIndex=0;score=0;isAnswered=false;
}

function startQuiz(){
  const sel = document.getElementById('typeSel').value;
  if(sel==="single"){
    useList = fullQuestionList.filter(q=>q.type==="单选题");
  }else if(sel==="multi"){
    useList = fullQuestionList.filter(q=>q.type==="多选题");
  }else{
    useList = [...fullQuestionList];
  }
  currentIndex=0;score=0;isAnswered=false;
  hideAll();
  document.getElementById('quizView').classList.remove('hide');
  renderQuestion();
}

function renderQuestion(){
  if(currentIndex >= useList.length){
    alert(`刷题结束！得分：${score} / ${useList.length}`);
    goHome();
    return;
  }
  isAnswered = false;
  const q = useList[currentIndex];
  document.getElementById('qIdx').innerText = currentIndex+1;
  document.getElementById('totalCnt').innerText = useList.length;
  document.getElementById('scoreVal').innerText = score;
  document.getElementById('qType').innerText = q.type;
  document.getElementById('qText').innerText = q.q;
  const wrap = document.getElementById('optionWrap');
  wrap.innerHTML = '';
  q.opts.forEach((optStr)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerText = optStr;
    div.dataset.opt = optStr.charAt(0);
    div.onclick = ()=>selectAnswer(div,q.ans);
    wrap.appendChild(div);
  });
  const tip = document.getElementById('answerTip');
  tip.classList.add('hide');
  document.getElementById('nextBtn').disabled = true;
}

function selectAnswer(el, rightAns){
  if(isAnswered) return;
  isAnswered = true;
  const userSel = el.dataset.opt;
  const tip = document.getElementById('answerTip');
  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach(o=>{
    if(o.dataset.opt === rightAns) o.classList.add('right');
  })
  if(userSel === rightAns){
    el.classList.add('right');
    score +=1;
    tip.className = 'result-tip correct-tip';
    tip.innerText = "✅回答正确";
  }else{
    el.classList.add('wrong');
    tip.className = 'result-tip error-tip';
    tip.innerText = `❌回答错误，正确答案：${rightAns}`;
  }
  tip.classList.remove('hide');
  document.getElementById('scoreVal').innerText = score;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  currentIndex++;
  renderQuestion();
}
</script>
